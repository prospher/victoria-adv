<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | Victoria Nascimento</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#241110">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&amp;family=Jost:wght@300;400&amp;display=swap" rel="stylesheet">
<style>
  :root { --serif: "Cormorant Garamond", Georgia, serif; --sans: "Jost", system-ui, sans-serif; --color-bg: #F7F0E4; --color-dark: #241110; --color-accent-300: #DDBD82; --color-accent: #A9832F; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100svh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; background: var(--color-dark); color: var(--color-bg); font-family: var(--sans); font-weight: 300; }
  p.kicker { font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--color-accent-300); margin: 0 0 20px; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(30px, 5vw, 48px); line-height: 1.15; margin: 0 0 20px; }
  p { font-size: 16px; line-height: 1.65; margin: 0 0 32px; color: color-mix(in srgb, var(--color-bg) 85%, transparent); }
  a { display: inline-flex; border: 1px solid currentColor; padding: 14px 30px; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-accent-300); text-decoration: none; transition: background .2s, color .2s; }
  a:hover { background: var(--color-accent-300); border-color: var(--color-accent-300); color: var(--color-dark); }
  :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <p class="kicker">Erro 404</p>
  <h1>Página não encontrada</h1>
  <p>O endereço acessado não existe ou foi movido.</p>
  <a href="/">Voltar para a página inicial</a>
</main>
</body>
</html>
